<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms Definitions</title>
</head>
<body>
  <form name="contact" data-netlify="true" hidden>
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="text" name="service" />
    <textarea name="message"></textarea>
  </form>

  <form name="hero-quote" data-netlify="true" hidden>
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="text" name="service" />
  </form>

  <form name="tank-popup-form" data-netlify="true" hidden>
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="text" name="service" />
  </form>
</body>
</html>
